<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel e-sus</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <img
        id="logo"
        src="assets/img/logo.png"
        alt="Logo da Prefeitura de Fazenda Rio Grande"
      />
      <div>
        <p id="prefeitura">Prefeitura de Fazenda Rio Grande</p>
        <p id="sec-saude">Secretaria Municipal de Saúde</p> <h4>painel version 1.0.3(production)</h4>
      </div>
    </header>

    <div id="wrapper">
      <div id="chamadas">
        <div id="destaque"></div>

        <p id="historico-label">Últimas Chamadas</p>
        <div id="h-header">
          <p>Nome</p>
          <p>Consultório</p>
          <p>Hora</p>
        </div>
        <div id="historico"></div>
      </div>

      <!--midia-->
      <div id="ads">
        <div id="video">
          <!--iframe
            src="https://www.youtube.com/embed/o4xzfWZ5HI4?autoplay=1&list=PLRTg76mddJgMWaZE3Om6ov0W0TrdVuelG&loop=1&controls=0&mute=1"

            frameborder="0"

            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe-->
        </div>

        <div class="time-container">
          <div id="time"></div>
          <div id="date"></div>
        </div>

      </div>
    </div>

    <footer>
      <div id="ww_b9485a20430ed" v='1.3' loc='id' a='{"t":"ticker","lang":"pt","sl_lpl":1,"ids":["wl5159"],"font":"Arial","sl_ics":"one_a","sl_sot":"celsius","cl_bkg":"image","cl_font":"#FFFFFF","cl_cloud":"#FFFFFF","cl_persp":"#81D4FA","cl_sun":"#FFC107","cl_moon":"#FFC107","cl_thund":"#FF5722"}'>Mais previsões: <a href="https://tempolongo.com/rio_de_janeiro_tempo_25_dias/" id="ww_b9485a20430ed_u" target="_blank">Rio de Janeiro 30 day forecast</a></div><script async src="https://app3.weatherwidget.org/js/?id=ww_b9485a20430ed"></script>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./src/socket.js"></script>
    <script>
      socket.on("reload", () => {
      location.reload();
  });
    </script>



    <!--carousel ultimas chamadas-->
    <footer class='historico-carousel'>
      <h2>carrousel chamadas</h2>
      <div class="carousel-wrapper">
        <div id="carousel" class="carousel-track">
          <!--blocks antigos aqui-->
        </div>
      </div>
    </footer>

      <!-- Botão Flutuante de Simulação (Ideal para testes) -->
    <button id="btn-chamar" class="btn-floating">+</button>
